<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb"><meta name="description" content="Image tools that run in your browser.">
<title>SoroVision — Soro</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css">
</head>
<body><div class="wrap"><header><div class="brand">◈ SoroVision</div><span class="pill">ON-DEVICE PROCESSING</span></header><section class="hero"><h1>Image tools.<br><span>Nothing leaves your device.</span></h1><label class="upload">Choose an image<input id="file" type="file" accept="image/*" hidden></label></section><section class="panel"><div class="preview" id="preview"><p class="muted">Your image preview will appear here.</p></div><div class="controls"><label>Width <input id="width" type="number" min="1" max="6000" value="800"></label><label>Height <input id="height" type="number" min="1" max="6000" value="600"></label><label>Brightness <input id="brightness" type="range" min="50" max="150" value="100"></label><label>Grayscale <input id="grayscale" type="range" min="0" max="100" value="0"></label><label>Format <select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select></label><button id="export" class="primary" disabled>Export image</button></div><p id="info" class="muted"></p></section><canvas id="canvas" hidden></canvas></div>

<script src="js/app.js" defer></script></body></html>
