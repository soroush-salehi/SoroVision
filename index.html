<title>SoroVision — Soro</title><style>:root{color-scheme:light;--ink:#182238;--muted:#758198;--line:#e5eaf2;--blue:#4169f5;--bg:#f5f7fb;--card:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px}button:hover{border-color:#aebdfd}input,textarea,select{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:var(--ink);width:100%;outline:none}input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #4169f51a}.brand{font-weight:800;font-size:21px;letter-spacing:-.8px}.brand span,.hero h1 span{color:var(--blue)}.muted,small{color:var(--muted)}small{display:block;font-size:12px}.pill{font-size:10px;letter-spacing:1.2px;border:1px solid var(--line);border-radius:99px;padding:7px 10px;color:var(--muted)}.wrap{max-width:1100px;margin:0 auto;padding:34px 24px}.wrap>header,.app>header{display:flex;align-items:center;justify-content:space-between;gap:16px}.hero{padding:58px 0 34px}.hero h1{font-size:clamp(38px,6vw,66px);line-height:1.04;letter-spacing:-2.8px;margin:12px 0}.hero p{color:var(--muted);max-width:580px}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 28px #23365b08}.eyebrow{font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:700}.primary,.send{background:var(--blue);color:white;border-color:var(--blue)}.upload{display:inline-flex;background:var(--blue);color:#fff;padding:12px 18px;border-radius:10px;cursor:pointer;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.tools{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.tools input{max-width:320px}footer{padding:24px 0;color:var(--muted);font-size:12px}.small,.tiny{font-size:10px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#101a30;color:white;padding:26px 18px}.side .brand{margin-bottom:34px}.side button{width:100%;text-align:left}.side .muted{margin-top:28px;color:#8b9ab5}.history{background:transparent!important;border:0!important;color:#cbd5e7!important;margin:4px 0}.shell main{max-width:900px;width:100%;margin:auto;display:flex;flex-direction:column;min-height:100vh;padding:24px}.shell main>header{display:flex;justify-content:space-between}.shell .hero{text-align:center;margin:auto}.orb{font-size:30px;color:var(--blue)}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.chip{border-radius:99px}.messages{flex:1;overflow:auto;padding:20px}.msg{max-width:75%;padding:14px 16px;border-radius:14px;margin:12px 0;background:white;border:1px solid var(--line)}.msg.you{margin-left:auto;background:#eaf0ff}.msg p{margin:4px 0}.composer{position:relative;display:grid;grid-template-columns:1fr 48px;gap:8px}.composer small{grid-column:1/-1}.send{font-size:22px}.timer{text-align:center}.timer #clock{font-size:72px;font-weight:750;letter-spacing:-3px;margin:20px}.controls{display:flex;justify-content:center;gap:8px}.stat strong{display:block;font-size:44px;margin-top:28px}.tasks{grid-column:1/-1}.tasks form{display:flex;gap:8px}.tasks ul{list-style:none;padding:0}.tasks li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.tasks label{display:flex;gap:10px;align-items:center}.tasks input[type=checkbox]{width:auto}.done{text-decoration:line-through;color:var(--muted)}.remove{border:0;color:#a0a8b8}.desktop{height:100vh;background:linear-gradient(135deg,#101a30,#283d6b);color:#fff;overflow:hidden}.top{height:44px;background:#0b1427dd;display:flex;justify-content:space-between;padding:10px 18px;font-size:12px}.icons{display:flex;gap:24px;padding:28px}.icons button{background:transparent;border:0;color:white;font-size:26px;display:grid;gap:4px}.icons small{color:#d5def1}.dock{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px;background:#ffffff24;backdrop-filter:blur(18px);border:1px solid #ffffff35;border-radius:18px}.dock button{font-size:22px;background:#ffffff20;color:white;border:0}.window{position:absolute;width:min(440px,80vw);min-height:190px;background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 20px 60px #0005;overflow:hidden}.bar{background:#f1f4fa;padding:10px 14px;display:flex;justify-content:space-between;cursor:move}.bar button{padding:2px 9px}.inside{padding:18px}.inside textarea{min-height:120px}.items{display:grid;gap:8px}.file{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:12px}.file>div:nth-child(2){flex:1}.fileicon{font-size:24px;color:var(--blue)}.file button{font-size:12px}.empty{text-align:center;color:var(--muted);padding:35px}.app{min-height:100vh}.app>header{padding:18px 24px;background:#fff;border-bottom:1px solid var(--line)}.work{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 70px)}.editors,.preview{padding:16px;min-width:0}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.active{background:#eaf0ff;color:var(--blue);border-color:#cbd6ff}.editors textarea{height:calc(100vh - 150px);font:13px/1.6 ui-monospace,monospace;resize:vertical}.preview{background:#e9edf5}.label{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;margin-bottom:10px}.preview iframe{width:100%;height:calc(100vh - 150px);border:0;border-radius:12px;background:white}.preview img{max-width:100%;max-height:400px;object-fit:contain}.preview{min-height:250px;display:grid;place-items:center}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:18px}.controls label{display:grid;gap:6px;font-size:12px;color:var(--muted)}.controls input,.controls select{width:120px}.meter{height:8px;background:#edf0f6;border-radius:9px;margin:20px 0 10px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}.field{display:grid;gap:8px}.check{padding:10px 0;border-bottom:1px solid var(--line)}.check p{margin:4px 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}.stats strong{display:block;font-size:30px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}#chart{width:100%;max-height:260px;margin-top:20px}.chat{height:100vh;display:grid;grid-template-columns:280px 1fr;background:#fff}.chat aside{padding:24px 16px;background:#f8f9fc;border-right:1px solid var(--line)}.chat aside .brand{margin-bottom:25px}.person{display:flex;gap:12px;align-items:center;padding:14px 8px;border-radius:12px;margin-top:8px}.person.active{background:#eaf0ff}.person i,.chat main header i{width:38px;height:38px;border-radius:50%;background:#dbe4ff;color:#3454bd;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}.person span{flex:1}.chat main{display:flex;flex-direction:column;min-width:0}.chat main header{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}.chat main header .pill{margin-left:auto}.feed{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:12px}.day{text-align:center;color:var(--muted);font-size:10px;letter-spacing:1px}.bubble{max-width:min(520px,80%);background:#f1f4fa;padding:14px 16px;border-radius:4px 16px 16px 16px}.bubble small{margin-top:8px;text-align:right}.bubble.mine{align-self:flex-end;background:#eaf0ff;border-radius:16px 4px 16px 16px}.chat form{display:flex;gap:8px;padding:16px 22px;border-top:1px solid var(--line)}.chat form input{flex:1}canvas{max-width:100%;height:auto;border-radius:12px;background:#111b31}.stat,.timer{min-height:190px}@media(max-width:720px){.grid,.work{grid-template-columns:1fr}.shell{grid-template-columns:1fr}.side{display:none}.shell main{padding:16px}.hero{padding:35px 0 24px}.tasks{grid-column:auto}.chat{grid-template-columns:1fr}.chat aside{display:none}.editors textarea,.preview iframe{height:50vh}.wrap{padding:22px 16px}.controls{align-items:stretch}}</style>
</head>
<body><div class="wrap"><header><div class="brand">◈ SoroVision</div><span class="pill">ON-DEVICE PROCESSING</span></header><section class="hero"><h1>Image tools.<br><span>Nothing leaves your device.</span></h1><label class="upload">Choose an image<input id="file" type="file" accept="image/*" hidden></label></section><section class="panel"><div class="preview" id="preview"><p class="muted">Your image preview will appear here.</p></div><div class="controls"><label>Width <input id="width" type="number" min="1" max="6000" value="800"></label><label>Height <input id="height" type="number" min="1" max="6000" value="600"></label><label>Format <select id="format"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option></select></label><button id="export" class="primary" disabled>Export image</button></div><p id="info" class="muted"></p></section><canvas id="canvas" hidden></canvas></div>
<script>const $=s=>document.querySelector(s);let img=new Image(),ready=false;$('#file').onchange=e=>{let f=e.target.files[0];if(!f)return;let u=URL.createObjectURL(f);img.onload=()=>{ready=true;$('#width').value=img.naturalWidth;$('#height').value=img.naturalHeight;$('#preview').innerHTML='';let p=img.cloneNode();p.src=u;$('#preview').append(p);$('#info').textContent=img.naturalWidth+' × '+img.naturalHeight+' · '+f.type;$('#export').disabled=false;};img.src=u};$('#width').onchange=()=>{if(ready&&img.naturalWidth)$('#height').value=Math.round(+$('#width').value*img.naturalHeight/img.naturalWidth)};$('#export').onclick=()=>{let w=Math.max(1,Math.min(6000,+$('#width').value)),h=Math.max(1,Math.min(6000,+$('#height').value)),c=$('#canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);c.toBlob(b=>{if(!b)return;let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download='sorovision.'+($('#format').value==='image/png'?'png':'jpg');a.click();URL.revokeObjectURL(u)},$('#format').value,.92)};</script>
